# XcodeGen 工程声明 —— 经 scripts/gen.sh 生成 Moodments.xcodeproj
# 工程可脚本化重建，pbxproj 不入库、不手改。
name: Moodments
options:
  bundleIdPrefix: com.moodments
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete   # Swift 6 严格并发

targets:
  Moodments:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Moodments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 时刻
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
      # 阶段 7 接 iCloud/StoreKit 时再启用 entitlements：
      # CODE_SIGN_ENTITLEMENTS: Config/Moodments.entitlements

  MoodmentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MoodmentsTests
    dependencies:
      - target: Moodments
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.tests

  MoodmentsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MoodmentsUITests
    dependencies:
      - target: Moodments
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.uitests

schemes:
  Moodments:
    build:
      targets:
        Moodments: all
        MoodmentsTests: [test]
        MoodmentsUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MoodmentsTests
        - MoodmentsUITests
