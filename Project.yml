# XcodeGen 工程声明 —— 经 scripts/gen.sh 生成 Moodments.xcodeproj
# 工程可脚本化重建，pbxproj 不入库、不手改。
name: Moodments
options:
  bundleIdPrefix: com.moodments
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"
  # 阶段 7 D 本地化（见 12-quality-assurance.md §12.2）：开发区域固定 zh-Hans（简中是本 App
  # 的主文案源语言，`Localizable.xcstrings` 的 `sourceLanguage` 与此一致），`en` 为第二本地化。
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete   # Swift 6 严格并发

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.1

targets:
  Moodments:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/Moodments
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 时刻
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # iCloud（CloudKit 私有库同步，见 09-icloud-sync.md）+ Face ID（隐私锁，见
        # 10-security-privacy.md）。M5 后生产数据权威是 canonical local store，启动不再创建
        # SwiftData CloudKit `ModelContainer`；当前 iCloud 行只做能力/网络启发式展示，真实同步
        # 状态机后续单独接入。
        CODE_SIGN_ENTITLEMENTS: Config/Moodments.entitlements
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用于解锁「时刻」以保护你的心情日记隐私"
    dependencies:
      - package: GRDB

  MoodmentsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MoodmentsTests
      # `SKTestSession(configurationFileNamed:)` 按名从**测试目标自身**的 bundle 资源加载
      # `.storekit` 配置（见 `PurchaseTests`、11-monetization.md §12.3 StoreKit 测试）。
      - path: Config/Moodments.storekit
        buildPhase: resources
    dependencies:
      - target: Moodments
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.tests

  MoodmentsUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/MoodmentsUITests
    dependencies:
      - target: Moodments
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.moodments.uitests

schemes:
  Moodments:
    build:
      targets:
        Moodments: all
        MoodmentsTests: [test]
        MoodmentsUITests: [test]
    run:
      config: Debug
      # `scripts/run.sh` 实机/模拟器直接运行时使用本地 StoreKit 测试配置（11-monetization.md），
      # 不依赖 App Store Connect 真实商品；`xcodebuild test` 走的 `PurchaseTests`（`SKTestSession`）
      # 与本 scheme 设置相互独立，见该文件顶部注释。
      storeKitConfiguration: Config/Moodments.storekit
    test:
      gatherCoverageData: true
      targets:
        - MoodmentsTests
        - MoodmentsUITests
