# XcodeGen 工程声明 —— 经 scripts/gen.sh 生成 HeatMoment.xcodeproj
# 工程可脚本化重建，pbxproj 不入库、不手改。
name: HeatMoment
options:
  bundleIdPrefix: com.heatmoment
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"
  # 阶段 7 D 本地化（见 docs/current/testing-architecture.md §12.2）：开发区域固定 zh-Hans（简中是本 App
  # 的主文案源语言，`Localizable.xcstrings` 的 `sourceLanguage` 与此一致），`en` 为第二本地化。
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.8"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: complete   # Swift 6 严格并发

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.11.1

targets:
  HeatMoment:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/HeatMoment
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.heatmoment.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: 心绪日记
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        # Face ID（隐私锁，见 docs/current/implementation-truth.md）。生产数据权威是 canonical local store。
        # iCloud / CloudKit entitlement 默认不接入 App target，避免 Personal Team 真机开发签名失败；
        # 未来恢复 iCloud 同步时再启用 Config/HeatMoment.entitlements 并使用支持 iCloud 的付费 Team。
        INFOPLIST_KEY_NSFaceIDUsageDescription: "用于解锁「心绪日记」以保护你的心情日记隐私"
    dependencies:
      - package: GRDB

  HeatMomentTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/HeatMomentTests
      # `SKTestSession(configurationFileNamed:)` 按名从**测试目标自身**的 bundle 资源加载
      # `.storekit` 配置（见 `PurchaseTests`、docs/current/implementation-truth.md §12.3 StoreKit 测试）。
      - path: Config/HeatMoment.storekit
        buildPhase: resources
    dependencies:
      - target: HeatMoment
      - package: GRDB
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.heatmoment.tests

  HeatMomentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/HeatMomentUITests
    dependencies:
      - target: HeatMoment
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.heatmoment.uitests

schemes:
  HeatMoment:
    build:
      targets:
        HeatMoment: all
        HeatMomentTests: [test]
        HeatMomentUITests: [test]
    run:
      config: Debug
      # `scripts/run.sh` 实机/模拟器直接运行时使用本地 StoreKit 测试配置（docs/current/implementation-truth.md），
      # 不依赖 App Store Connect 真实商品；`xcodebuild test` 走的 `PurchaseTests`（`SKTestSession`）
      # 与本 scheme 设置相互独立，见该文件顶部注释。
      storeKitConfiguration: Config/HeatMoment.storekit
    test:
      gatherCoverageData: true
      targets:
        - HeatMomentTests
        - HeatMomentUITests
